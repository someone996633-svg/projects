<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HTML List Tags</title>
</head>
<body>
  <h1>HTML List Tags</h1>

  <h2>Unordered List (ul)</h2>
  <ul type="square">
    <li>HTML</li>
    <li>CSS</li>
    <li>JavaScript</li>
  </ul>

  <h2>Ordered List (ol)</h2>
  <ol type="A"  >
    <li>Learn HTML</li>
    <li>Style with CSS</li>
    <li>Build with JavaScript</li>
  </ol>
</body>
</html>
